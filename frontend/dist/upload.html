<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload — Vocentra</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/upload-B-DhOPzf.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/purify.es-jbyHYIsq.js">
    <link rel="stylesheet" crossorigin href="/assets/theme-R_iNOmRO.css">
  </head>
  <body class="page-upload" style="min-height: 100vh">
    <!-- Background elements -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="scene">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="grid-mesh"></div>

    <!-- Nav -->
    <nav class="nav">
      <div class="nav-inner glass" id="navInner">
        <a href="/index.html" class="nav-brand">
          <svg class="nav-logo-svg" width="30" height="30" viewBox="0 0 32 32">
            <defs>
              <linearGradient id="navLG" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#63b3ed" />
                <stop offset="100%" stop-color="#7c3aed" />
              </linearGradient>
            </defs>
            <polygon
              points="16,1 31,8.5 31,23.5 16,31 1,23.5 1,8.5"
              fill="none"
              stroke="url(#navLG)"
              stroke-width="1.5"
            />
            <circle cx="16" cy="16" r="3.2" fill="url(#navLG)" />
          </svg>
          <span class="nav-brand-name">Vocentra</span>
        </a>
        <div class="nav-right">
          <button
            class="btn-ghost"
            onclick="window.location.href = '/result.html'"
          >
            Sample Demo
          </button>
          <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb">
              <span class="toggle-icon" id="toggleIcon">🌙</span>
            </div>
          </button>
        </div>
      </div>
    </nav>

    <!-- React Root -->
    <main class="upload-main">
      <div id="upload-root"></div>
    </main>

    <script src="/src/utils/animations.js"></script>
    <script src="/src/utils/legacy-script.js"></script>
  </body>
</html>
